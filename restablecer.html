<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - OMC</title>

    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================
           RESET Y BASE (diseño premium)
           ============================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-primary: #0A3035;
            --color-secondary: #030709;
            --color-text: #FFFFFF;
            --color-accent: #00FF7B;
            --color-accent-dim: rgba(0, 255, 123, 0.2);
            --color-border: rgba(255, 255, 255, 0.08);
            --font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --radius: 20px;
            --shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
            --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: var(--font-family) !important;
            font-size: 16px;
            background: var(--color-secondary);
            color: var(--color-text);
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            min-height: 100vh;
        }

        /* ============================================
           FONDO DE ONDAS (movimiento mejorado)
           ============================================ */
        .corporate-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 50%, #0A3035 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 50%, #0A3035 0%, transparent 60%),
                        radial-gradient(ellipse at 50% 80%, #0A3035 0%, transparent 50%),
                        #030709;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .corporate-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(0, 255, 123, 0.04) 0%, transparent 30%),
                        radial-gradient(circle at 70% 60%, rgba(0, 255, 123, 0.03) 0%, transparent 40%),
                        radial-gradient(circle at 50% 80%, rgba(0, 255, 123, 0.05) 0%, transparent 35%);
            animation: waveMove1 15s ease-in-out infinite alternate;
        }

        .corporate-bg::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 60% 30%, rgba(0, 255, 123, 0.02) 0%, transparent 40%),
                        radial-gradient(circle at 20% 70%, rgba(0, 255, 123, 0.03) 0%, transparent 50%);
            animation: waveMove2 10s linear infinite alternate;
        }

        @keyframes waveMove1 {
            0% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(8%, -6%) scale(1.08); }
            50% { transform: translate(-4%, 4%) scale(0.92); }
            75% { transform: translate(5%, -5%) scale(1.05); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes waveMove2 {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-8%, 4%) scale(1.12); }
            66% { transform: translate(6%, -6%) scale(0.88); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* ============================================
           SCROLLBAR
           ============================================ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--color-accent); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #66ffa3; }

        /* ============================================
           TOAST (notificación)
           ============================================ */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(10, 48, 53, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 12px 24px;
            color: #fff;
            font-family: var(--font-family) !important;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #toast .toast-icon {
            width: 20px;
            height: 20px;
            fill: var(--color-accent);
        }

        /* ============================================
           TARJETA PRINCIPAL (glassmorphism)
           ============================================ */
        .main-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 48, 53, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 32px 30px 28px;
            max-width: 460px;
            width: 100%;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .main-card .icon-shield {
            width: 48px;
            height: 48px;
            fill: var(--color-accent);
            display: block;
            margin: 0 auto 10px;
        }

        .main-card h2 {
            font-size: 24px;
            font-weight: 700;
            color: #FFFFFF;
            font-family: var(--font-family) !important;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .main-card .subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.6);
            font-weight: 400;
            margin-bottom: 16px;
            font-family: var(--font-family) !important;
        }

        /* ============================================
           TOKEN BOX
           ============================================ */
        .token-box {
            background: rgba(255,255,255,0.04);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            word-break: break-all;
            font-family: 'Courier New', monospace;
            color: var(--color-accent);
            margin: 10px 0 14px;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        /* ============================================
           STATUS
           ============================================ */
        .status {
            margin: 10px 0 14px;
            font-weight: 500;
            font-family: var(--font-family) !important;
            font-size: 15px;
            min-height: 24px;
        }
        .status.success { color: var(--color-accent); }
        .status.error { color: #ff6b6b; }
        .status.info { color: rgba(255,255,255,0.7); }

        /* ============================================
           BOTONES
           ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--color-accent);
            color: #030709;
            border: none;
            border-radius: 50px;
            padding: 10px 24px;
            font-family: var(--font-family) !important;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            margin: 3px 0;
            min-width: 160px;
        }

        .btn:hover:not(:disabled) {
            background: #66ffa3;
            box-shadow: 0 0 25px rgba(0, 255, 123, 0.3);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #FFFFFF;
            border: 1px solid var(--color-border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(255,255,255,0.12);
            border-color: var(--color-accent);
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 5px 14px;
            font-size: 14px;
            min-width: auto;
            border-radius: 30px;
        }

        .btn-sm .icon-clipboard {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .btn .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(3,7,9,0.2);
            border-top: 3px solid #030709;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }

        .btn-secondary .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #fff;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin: 6px 0 4px;
        }

        .btn-group-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        /* ============================================
           FALLBACK
           ============================================ */
        .fallback {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.04);
            font-size: 14px;
            color: rgba(255,255,255,0.4);
            font-family: var(--font-family) !important;
        }

        .fallback strong {
            color: rgba(255,255,255,0.6);
        }

        .steps {
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            padding: 10px 14px 10px 26px;
            margin: 8px 0;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .steps li {
            margin-bottom: 4px;
            color: rgba(255,255,255,0.6);
            font-family: var(--font-family) !important;
            font-size: 14px;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 480px) {
            body { padding: 14px; }
            .main-card { padding: 24px 18px 20px; }
            .main-card h2 { font-size: 22px; }
            .main-card .icon-shield { width: 40px; height: 40px; }
            .btn { font-size: 15px; padding: 9px 18px; min-width: 130px; }
            .btn-sm { font-size: 13px; padding: 4px 12px; }
            .token-box { font-size: 13px; padding: 8px 12px; }
            .status { font-size: 14px; }
            .fallback { font-size: 13px; }
            .steps li { font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- Fondo de ondas -->
    <div class="corporate-bg"></div>

    <!-- Toast -->
    <div id="toast">
        <svg class="toast-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
        <span id="toastMessage">Token copiado al portapapeles</span>
    </div>

    <!-- Tarjeta principal -->
    <div class="main-card">
        <svg class="icon-shield" viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5L12 1zm0 2.18l7 3.12v4.7c0 4.83-3.93 9.11-7 10.23-3.07-1.12-7-5.4-7-10.23V6.3l7-3.12z"/>
            <path d="M12 5.5v8l4.5-4.5-4.5-4.5z" opacity="0.3"/>
        </svg>
        <h2>Restablecer Contraseña</h2>
        <p class="subtitle">Se ha detectado un token de recuperación válido.</p>

        <div id="content">
            <!-- Contenido dinámico -->
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── OBTENER TOKEN ──────────────────────────────
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const content = document.getElementById('content');

            // ─── TOAST ────────────────────────────────────────
            const toastEl = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            let toastTimeout = null;

            function showToast(msg) {
                toastMessage.textContent = msg || 'Token copiado al portapapeles';
                toastEl.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 2800);
            }

            // ─── VALIDAR UUID ────────────────────────────────
            function isValidUUID(t) {
                if (!t) return false;
                const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
                return uuidRegex.test(t);
            }

            if (!token || !isValidUUID(token)) {
                content.innerHTML = `
                    <div style="color:#ff6b6b; font-size:3rem; margin-bottom:8px;">⛔</div>
                    <h2 style="color:#ff6b6b; font-size:22px; font-family:var(--font-family);">Acceso Denegado</h2>
                    <p style="color:rgba(255,255,255,0.6); font-size:15px; font-family:var(--font-family);">Este enlace de recuperación no es válido.</p>
                    <div style="margin-top:14px; padding:12px; background:rgba(255,255,255,0.02); border-radius:8px; border:1px solid rgba(255,255,255,0.04); color:rgba(255,255,255,0.3); font-size:14px; font-family:var(--font-family);">
                        Si has recibido este enlace por correo, asegúrate de copiarlo correctamente.
                    </div>
                `;
                return;
            }

            // ─── ESCAPAR HTML ────────────────────────────────
            function escapeHtml(str) {
                return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            }

            // ─── ESTADO ──────────────────────────────────────
            let intentoRealizado = false;
            let appAbierta = false;

            // ─── RENDERIZAR INTERFAZ ─────────────────────────
            function renderUI(statusMsg, statusClass, showLoader, btnText, showFallback) {
                const loaderHTML = showLoader ? `<span class="loader" id="loaderIcon"></span>` : '';
                const btnHTML = `
                    <div class="btn-group">
                        <button id="openAppBtn" class="btn">
                            ${loaderHTML}
                            <span id="btnText">${btnText || 'Abrir OMC App'}</span>
                        </button>
                        <button id="protocolBtn" class="btn btn-secondary" style="margin-top:2px;">Usar método alternativo</button>
                    </div>
                `;

                const fallbackHTML = showFallback ? `
                    <div class="fallback">
                        <p><strong>¿La aplicación no se abre?</strong></p>
                        <p>Asegúrate de que la aplicación <strong>OMC Admin</strong> esté <strong>en ejecución</strong>.</p>
                        <p>Si no se abre automáticamente, copia el token de abajo y abre la aplicación manualmente.</p>
                        <div class="steps">
                            <ol>
                                <li>Inicia la aplicación OMC Admin.</li>
                                <li>Ve al menú principal y busca "Restablecer contraseña".</li>
                                <li>Pega el token en el campo correspondiente.</li>
                            </ol>
                        </div>
                    </div>
                ` : '';

                const copyBtn = `
                    <button id="copyTokenBtn" class="btn btn-secondary btn-sm">
                        <svg class="icon-clipboard" viewBox="0 0 24 24">
                            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                        </svg>
                        Copiar token
                    </button>
                `;

                content.innerHTML = `
                    <div class="status ${statusClass}">${statusMsg}</div>
                    ${btnHTML}
                    <div style="margin-top:12px;">
                        <p style="color:rgba(255,255,255,0.35); font-size:14px; font-family:var(--font-family); margin-bottom:4px;">Tu token de recuperación:</p>
                        <div class="token-box" id="tokenDisplay">${escapeHtml(token)}</div>
                        <div class="btn-group-row">
                            ${copyBtn}
                        </div>
                    </div>
                    ${fallbackHTML}
                `;

                // ─── EVENTOS ──────────────────────────────────
                const openBtn = document.getElementById('openAppBtn');
                openBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (appAbierta) {
                        showToast('✅ La aplicación ya está abierta.');
                        return;
                    }
                    abrirConServidorLocal();
                });

                document.getElementById('protocolBtn').addEventListener('click', function(e) {
                    e.preventDefault();
                    abrirConProtocolo();
                });

                document.getElementById('copyTokenBtn').addEventListener('click', function(e) {
                    const tokenText = document.getElementById('tokenDisplay').textContent;
                    navigator.clipboard.writeText(tokenText).then(() => {
                        showToast('✅ Token copiado al portapapeles');
                    }).catch(() => {
                        const range = document.createRange();
                        range.selectNode(document.getElementById('tokenDisplay'));
                        window.getSelection().removeAllRanges();
                        window.getSelection().addRange(range);
                        document.execCommand('copy');
                        showToast('✅ Token copiado al portapapeles');
                    });
                });
            }

            // ─── ACTUALIZAR UI DINÁMICAMENTE ──────────────────
            function updateUI(statusMsg, statusClass, showLoader, btnText) {
                const statusEl = document.querySelector('.status');
                const openBtn = document.getElementById('openAppBtn');
                const loader = document.getElementById('loaderIcon');
                const btnTextEl = document.getElementById('btnText');

                if (statusEl) {
                    statusEl.textContent = statusMsg;
                    statusEl.className = `status ${statusClass}`;
                }
                if (openBtn) {
                    openBtn.disabled = showLoader;
                }
                if (loader) {
                    loader.style.display = showLoader ? 'inline-block' : 'none';
                }
                if (btnTextEl) {
                    btnTextEl.textContent = btnText || 'Abrir OMC App';
                }
            }

            // ─── MÉTODO 1: Servidor local (una sola vez) ──
            function abrirConServidorLocal() {
                if (intentoRealizado) {
                    updateUI('⚠️ Ya se realizó un intento. Si no se abrió, usa el método alternativo.', 'error', false, 'Reintentar');
                    return;
                }
                if (appAbierta) {
                    updateUI('✅ La aplicación ya está abierta. El token ha sido enviado.', 'success', false, 'Abrir OMC App');
                    return;
                }
                intentoRealizado = true;

                updateUI('⏳ Conectando con el servidor local...', 'info', true, 'Conectando...');

                // Intentar puerto 3000 (el más común)
                fetch(`http://localhost:3000/open?token=${encodeURIComponent(token)}`, {
                    method: 'GET',
                    mode: 'no-cors'
                }).then(() => {
                    // Éxito: la aplicación ya estaba abierta
                    appAbierta = true;
                    updateUI('✅ Aplicación detectada. El token ha sido enviado.', 'success', false, 'Abrir OMC App');
                    showToast('✅ Aplicación abierta correctamente.');
                }).catch(() => {
                    // Falló: mostrar botón de reintento
                    updateUI('⚠️ No se pudo conectar al servidor local. Usa el método alternativo o reintenta.', 'error', false, 'Reintentar');
                });
            }

            // ─── MÉTODO 2: Protocolo (fallback manual) ──────
            function abrirConProtocolo() {
                updateUI('⏳ Intentando abrir con protocolo...', 'info', true, 'Abriendo...');
                const url = `omcapp://restablecer?token=${encodeURIComponent(token)}`;
                window.location.href = url;
                // Después de 2 segundos, mostrar mensaje
                setTimeout(() => {
                    updateUI('🔗 Protocolo ejecutado. Si la aplicación no se abre, verifica que esté instalada.', 'info', false, 'Abrir OMC App');
                }, 2000);
            }

            // ─── INICIALIZAR UI ──────────────────────────────
            renderUI(
                '🔑 Token válido. Presiona "Abrir OMC App" para continuar.',
                'info',
                false,
                'Abrir OMC App',
                true // mostrar fallback
            );

            // ─── INTENTO AUTOMÁTICO (una sola vez) ────────────
            setTimeout(() => {
                if (!intentoRealizado && !appAbierta) {
                    abrirConServidorLocal();
                }
            }, 800);

        })();
    </script>

</body>
</html>
